<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HIBI | Login & Register</title>
    <style>
      header {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 9999;
        transition: var(--transition);
        background: transparent;
      }

      header.scrolled {
        background: rgba(54, 103, 138, 0.95);
        backdrop-filter: blur(10px);
        box-shadow: var(--shadow-sm);
      }

      .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 24px;
        max-width: 1200px;
        margin: 0 auto;
      }

      .logo-text {
        color: var(--white-color);
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 1px;
      }

      .nav-menu {
        display: flex;
        gap: 10px;
      }

      .nav-link {
        color: var(--white-color);
        padding: 8px 16px;
        border-radius: 30px;
        font-weight: 500;
        transition: var(--transition);
      }

      .nav-link:hover {
        background: rgba(255, 255, 255, 0.1);
        color: var(--secondary-color);
      }

      #menu-open-button,
      #menu-close-button {
        font-size: 24px;
        color: var(--white-color);
        display: none;
      }

      .login-forward-btn {
        top: 24px;
        right: 24px;
        background-color: #9eccd2;
        color: #274b66;
        padding: 10px 24px;
        text-decoration: none;
        border-radius: 20px;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        font-size: 16px;
        font-weight: 600;
        box-shadow: 0 4px 8px #9eccd2;
        transition: all 0.3s ease;
      }

      .login-forward-btn:hover {
        background-color: #ffffff;
        box-shadow: 0 6px 12px #9eccd2;
        transform: translateY(-2px);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        background-color: #274b66;
        color: #ffffff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        overflow-x: hidden;
      }

      a {
        color: #ffffff;
        text-decoration: none;
        transition: opacity 0.2s ease;
      }

      a:hover {
        opacity: 0.8;
        text-decoration: underline;
      }

      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 40px 20px;
        position: relative;
        z-index: 10;
      }

      .form-container {
        width: 100%;
        max-width: 420px;
      }

      .form-title {
        text-align: center;
        font-size: 32px;
        margin-bottom: 35px;
        font-weight: 700;
      }

      .input-group {
        margin-bottom: 20px;
      }

      .label-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 8px;
        font-size: 14px;
      }

      .label-row a {
        color: rgba(255, 255, 255, 0.6);
        font-size: 13px;
      }

      .input-group input {
        width: 100%;
        padding: 14px 16px;
        background-color: rgba(0, 0, 0, 0.15);
        border: 1px solid #9eccd2;
        border-radius: 6px;
        color: #ffffff;
        font-size: 15px;
        outline: none;
        transition: box-shadow 0.3s ease;
      }

      .input-group input:focus {
        box-shadow: 0 0 0 2px rgba(158, 204, 210, 0.5);
      }

      .input-group input::placeholder {
        color: rgba(255, 255, 255, 0.4);
      }

      .btn-submit {
        width: 100%;
        padding: 14px;
        background-color: #9eccd2;
        color: #ffffff;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 10px;
        transition:
          background-color 0.2s,
          transform 0.1s;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
      }

      .btn-submit:hover {
        background-color: #8abac0;
      }

      .btn-submit:active {
        transform: scale(0.98);
      }

      .toggle-text {
        text-align: center;
        margin: 25px 0;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.7);
      }

      .toggle-text span {
        color: #ffffff;
        font-weight: bold;
        cursor: pointer;
      }

      .toggle-text span:hover {
        text-decoration: underline;
      }

      /* Menyembunyikan form register di awal */
      #register-section {
        display: none;
      }
    </style>
  </head>
  <body>
    <header id="header">
      <nav class="navbar section-content">
        <a href="#" class="nav-logo">
          <h2 class="logo-text">HIBI</h2>
        </a>
        <ul class="nav-menu">
          <li class="nav-item"><a href="HIBI/HIBI.html#" class="nav-link">Home</a></li>
          <li class="nav-item"><a href="HIBI/HIBI.html#about" class="nav-link">About</a></li>
          <li class="nav-item"><a href="HIBI/HIBI.html#library" class="nav-link">Library</a></li>
          <li class="nav-item"><a href="HIBI/HIBI.html#gallery" class="nav-link">Gallery</a></li>
          <li class="nav-item"><a href="HIBI/HIBI.html#" class="nav-link">Contact</a></li>
        </ul>
        <button id="menu-open-button" class="fa-solid fa-bars"></button>
        <button id="menu-close-button" class="fa-solid fa-times"></button>
        <a href="login.html" class="login-forward-btn">Login/Register</a>
      </nav>
    </header>
    <main>
      <div class="form-container" id="login-section">
        <h1 class="form-title">Sign in to your account</h1>

        <form action="#" onsubmit="event.preventDefault()">
          <div class="input-group">
            <div class="label-row">
              <label>Email</label>
            </div>
            <input type="email" placeholder="Email" required />
          </div>

          <div class="input-group">
            <div class="label-row">
              <label>Password</label>
              <a href="#">Forgot your password?</a>
            </div>
            <input type="password" placeholder="Password" required />
          </div>

          <button type="submit" class="btn-submit">Sign in</button>
        </form>

        <div class="toggle-text">Don't have an account yet? <span onclick="showRegister()">Create an Account</span></div>
      </div>

      <div class="form-container" id="register-section">
        <h1 class="form-title">Create an account</h1>

        <form action="#" onsubmit="event.preventDefault()">
          <div class="input-group">
            <div class="label-row">
              <label>Username</label>
            </div>
            <input type="text" placeholder="Username" required />
          </div>

          <div class="input-group">
            <div class="label-row">
              <label>Email</label>
            </div>
            <input type="email" placeholder="Email" required />
          </div>

          <div class="input-group">
            <div class="label-row">
              <label>Password</label>
            </div>
            <input type="password" placeholder="Password" required />
          </div>

          <button type="submit" class="btn-submit">Sign up</button>
        </form>

        <div class="toggle-text">Already have an account? <span onclick="showLogin()">Sign in</span></div>
      </div>

      <div class="illustration">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="40" fill="rgba(158, 204, 210, 0.1)" />
          <path d="M50 20 L80 80 L20 80 Z" fill="rgba(158, 204, 210, 0.2)" />
        </svg>
      </div>
    </main>
    <script>
      const loginSection = document.getElementById("login-section");
      const registerSection = document.getElementById("register-section");

      function showLogin() {
        loginSection.style.display = "block";
        registerSection.style.display = "none";
      }

      function showRegister() {
        loginSection.style.display = "none";
        registerSection.style.display = "block";
      }
    </script>
  </body>
</html>
