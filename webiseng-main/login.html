<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HIBI | Login/Register</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header id="header">
      <nav class="navbar section-content">
        <a href="HIBI.html#" class="nav-logo">
          <h2 class="logo-text">HIBI</h2>
        </a>
        <ul class="nav-menu">
          <li class="nav-item"><a href="HIBI.html#" class="nav-link">Home</a></li>
          <li class="nav-item"><a href="HIBI.html#about" class="nav-link">About</a></li>
          <li class="nav-item"><a href="HIBI.html#library" class="nav-link">Library</a></li>
          <li class="nav-item"><a href="HIBI.html#gallery" class="nav-link">Gallery</a></li>
          <li class="nav-item"><a href="HIBI.html#" class="nav-link">Contact</a></li>
        </ul>
        <a href="login.html" class="login-forward-btn">Login/Register</a>
        <button id="menu-open-button" class="fa-solid fa-bars"></button>
        <button id="menu-close-button" class="fa-solid fa-times"></button>
      </nav>
    </header>

    <main>
      <section class="hero-section" id="login">
        <div class="section-content">
          <div class="hero-details fade-in">
      <div class="auth-container">
        <h1>Sign in to your account</h1>

        <form action="#" method="POST">
          <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Email" required />
          </div>

          <div class="input-group">
            <div class="label-row">
              <label for="password">Password</label>
              <a href="#" class="forgot-pw">Forgot your password?</a>
            </div>
            <input type="password" id="password" placeholder="Password" required />
          </div>
          
          <button type="submit" class="btn-submit">Sign in</button>
        </form>

        <p class="register-text">Don't have an account yet? <a href="#">Create an Account</a></p>
      </div>
        <div class="wave-bottom"></div>
    </section>
</main>
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
